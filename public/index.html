<html>
    <head>
        <title>X-Bank</title>
        <link rel="stylesheet" href="style.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="header">
            <h1 id="title">X-Bank</h1>
            <div id="info-button"></div>
        </div>
        <div id="login-content">
            <div id="login-message">
                Log in to your account using User ID
                <br>
                and Password or <a id="create-link" href="/create">create a new one.</a>
            </div>
            <input id="user-id-input" class="login-input" placeholder="User ID"/>
            <input type="password" id="password-input" class="login-input" placeholder="Password"/>
            <button id="login-submit">Log in</button>
        </div>
    </body>
</html>
