<html>
    <head>
        <title>X-Bank</title>
        <link rel="stylesheet" href="/res/style.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="header">
            <h1 id="title">X-Bank</h1>
            <div id="info-button"></div>
        </div>
        <form id="login-content">
            <div id="login-message">
                Log in to your account using User ID
                <br>
                and Password or <a id="create-link" href="/signup">create a new one.</a>
            </div>
            <input id="user-id-input" class="login-input" placeholder="User ID" autocomplete="username"/>
            <input type="password" id="password-input" class="login-input" placeholder="Password" autocomplete="current-password"/>
            <button type="submit" id="login-submit">Log in</button>
        </form>
        <script src="/res/common.js"></script>
        <script src="/script.js"></script>
    </body>
</html>
